[project]
name = "nuclear"
version = "0.1.0"
description = "A package that has a mix of nuke related tooling to general 2d pipeline."
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "isort>=5.13",
    "mypy>=1.10",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.27",
    "pytest>=8.0",
    "ruff>=0.5",
    "pytest-sugar>=1.0",
    "pytest-cov>=6.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--cov=nuclear", "--cov-report=term-missing", "--cov-report=html"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

